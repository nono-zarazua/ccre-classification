stages:
  prepare_hepg2_els:
    cmd: bash src/get_hepg2_ELS.sh
    deps:
    - data/raw/hepg2_cCREs.bed
    - src/get_hepg2_ELS.sh
    outs:
    - data/processed/evn/hepg2/hepg2_ELS.bed
    - data/processed/evn/hepg2/hepg2_ELS.trimmed.bed
  make_folds_hepg2:
    cmd: bash src/make_folds.sh
    deps:
    - data/processed/evn/hepg2/hepg2_ELS.trimmed.bed
    - src/make_folds.sh
    outs:
    - data/processed/evn/hepg2/folds/fold1/fold1.bed
    - data/processed/evn/hepg2/folds/fold2/fold2.bed
    - data/processed/evn/hepg2/folds/fold3/fold3.bed
    - data/processed/evn/hepg2/folds/fold4/fold4.bed
    - data/processed/evn/hepg2/folds/fold5/fold5.bed
  build_negatives_hepg2:
    cmd: Rscript --vanilla src/build_negs.R <fold_nr>
    deps:
    - src/build_negs.R
    - data/processed/evn/hepg2/folds/fold1/fold1.bed
    - data/processed/evn/hepg2/folds/fold2/fold2.bed
    - data/processed/evn/hepg2/folds/fold3/fold3.bed
    - data/processed/evn/hepg2/folds/fold4/fold4.bed
    - data/processed/evn/hepg2/folds/fold5/fold5.bed
    outs:
    - data/processed/evn/hepg2/folds/fold1/fold1.fa
    - data/processed/evn/hepg2/folds/fold1/neg1x_fold1.bed
    - data/processed/evn/hepg2/folds/fold1/neg1x_fold1.fa
    - data/processed/evn/hepg2/folds/fold2/fold2.fa
    - data/processed/evn/hepg2/folds/fold2/neg1x_fold2.bed
    - data/processed/evn/hepg2/folds/fold2/neg1x_fold2.fa
    - data/processed/evn/hepg2/folds/fold3/fold3.fa
    - data/processed/evn/hepg2/folds/fold3/neg1x_fold3.bed
    - data/processed/evn/hepg2/folds/fold3/neg1x_fold3.fa
    - data/processed/evn/hepg2/folds/fold4/fold4.fa
    - data/processed/evn/hepg2/folds/fold4/neg1x_fold4.bed
    - data/processed/evn/hepg2/folds/fold4/neg1x_fold4.fa
    - data/processed/evn/hepg2/folds/fold5/fold5.fa
    - data/processed/evn/hepg2/folds/fold5/neg1x_fold5.bed
    - data/processed/evn/hepg2/folds/fold5/neg1x_fold5.fa
  make_outer_files_hepg2:
    cmd: for i in 1 2 3 4 5; do bash src/make_outer_files.sh "$i"; done
    deps:
    - data/processed/evn/hepg2/folds/fold1/fold1.fa
    - data/processed/evn/hepg2/folds/fold1/neg1x_fold1.fa
    - data/processed/evn/hepg2/folds/fold2/fold2.fa
    - data/processed/evn/hepg2/folds/fold2/neg1x_fold2.fa
    - data/processed/evn/hepg2/folds/fold3/fold3.fa
    - data/processed/evn/hepg2/folds/fold3/neg1x_fold3.fa
    - data/processed/evn/hepg2/folds/fold4/fold4.fa
    - data/processed/evn/hepg2/folds/fold4/neg1x_fold4.fa
    - data/processed/evn/hepg2/folds/fold5/fold5.fa
    - data/processed/evn/hepg2/folds/fold5/neg1x_fold5.fa
    - src/make_outer_files.sh
    outs:
    - data/processed/evn/hepg2/ls-gkm/training/outer1/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer1/train_pos.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer2/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer2/train_pos.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer3/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer3/train_pos.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer4/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer4/train_pos.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer5/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer5/train_pos.fa
  train_ls_gkm_hepg2:
    cmd: bash ../lsgkm/bin/gkmtrain -T 4 -m 16000 '<pos_fa>' '<neg_fa>' 
      'output_prefix'
    deps:
    - ../lsgkm/bin/gkmtrain
    - data/processed/evn/hepg2/ls-gkm/training/outer1/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer1/train_pos.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer2/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer2/train_pos.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer3/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer3/train_pos.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer4/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer4/train_pos.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer5/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer5/train_pos.fa
    outs:
    - models/evn/hepg2/ls-gkm/outer1.model.txt
    - models/evn/hepg2/ls-gkm/outer2.model.txt
    - models/evn/hepg2/ls-gkm/outer3.model.txt
    - models/evn/hepg2/ls-gkm/outer4.model.txt
    - models/evn/hepg2/ls-gkm/outer5.model.txt
  test_ls_gkm_hepg2:
    cmd: bash ../lsgkm/bin/gkmpredict -T 4 '<fasta>' '<model>' 'output'
    deps:
    - ../lsgkm/bin/gkmpredict
    - models/evn/hepg2/ls-gkm/outer1.model.txt
    - models/evn/hepg2/ls-gkm/outer2.model.txt
    - models/evn/hepg2/ls-gkm/outer3.model.txt
    - models/evn/hepg2/ls-gkm/outer4.model.txt
    - models/evn/hepg2/ls-gkm/outer5.model.txt
    outs:
    - predictions/evn/hepg2/ls-gkm/outer1/pos_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer1/neg_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer2/pos_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer2/neg_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer3/pos_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer3/neg_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer4/pos_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer4/neg_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer5/pos_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer5/neg_scores.txt
  merge_pos_negs_hepg2:
    cmd: for i in 1 2 3 4 5; do Rscript src/prepare_lsgkm_scores.R 
      predictions/evn/hepg2/ls-gkm/outer"$i"; done
    deps:
    - predictions/evn/hepg2/ls-gkm/outer1/neg_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer1/pos_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer2/neg_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer2/pos_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer3/neg_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer3/pos_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer4/neg_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer4/pos_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer5/neg_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer5/pos_scores.txt
    - src/prepare_lsgkm_scores.R
    outs:
    - results/evn/hepg2/ls-gkm/outer1.tsv
    - results/evn/hepg2/ls-gkm/outer2.tsv
    - results/evn/hepg2/ls-gkm/outer3.tsv
    - results/evn/hepg2/ls-gkm/outer4.tsv
    - results/evn/hepg2/ls-gkm/outer5.tsv
  merge_outers_hepg2:
    cmd: |
      {
        head -n 1 results/evn/hepg2/ls-gkm/outer1.tsv
        for FOLD in 1 2 3 4 5; do
          tail -n +2 "results/evn/hepg2/ls-gkm/outer$FOLD.tsv"
        done
      } > results/evn/hepg2/ls-gkm/all_outers.tsv    
    deps:
    - results/evn/hepg2/ls-gkm/outer1.tsv
    - results/evn/hepg2/ls-gkm/outer2.tsv
    - results/evn/hepg2/ls-gkm/outer3.tsv
    - results/evn/hepg2/ls-gkm/outer4.tsv
    - results/evn/hepg2/ls-gkm/outer5.tsv
    outs:
    - results/evn/hepg2/ls-gkm/all_outer.tsv
  render_evn_lsgkm_report_hepg2:
    cmd: bash src/render_report.sh  
    deps:
    - src/render_report.sh 
    - reports/lsgkm_results.Rmd 
    - results/evn/hepg2/ls-gkm/outer1.tsv
    - results/evn/hepg2/ls-gkm/outer2.tsv
    - results/evn/hepg2/ls-gkm/outer3.tsv
    - results/evn/hepg2/ls-gkm/outer4.tsv
    - results/evn/hepg2/ls-gkm/all_outer.tsv
    - results/evn/hepg2/ls-gkm/outer5.tsv
    outs:
    - reports/rendered/evn/lsgkm_hepg2_results.html 
