stages:
  prepare_hepg2_els:
    cmd: bash src/get_hepg2_ELS.sh
    deps:
    - data/raw/hepg2_cCREs.bed
    - src/get_hepg2_ELS.sh
    outs:
    - data/processed/hepg2_ELS.bed
    - data/processed/hepg2_ELS.trimmed.bed
  build_negatives:
    cmd: Rscript --vanilla src/build_negs.R
    deps:
    - data/processed/hepg2_ELS.trimmed.bed
    - src/build_negs.R
    outs:
    - data/processed/hepg2_ELS.trimmed.fa
    - data/processed/negatives/neg1x_hepg2_ELS.trimmed.bed
    - data/processed/negatives/neg1x_hepg2_ELS.trimmed.fa
  make_folds:
    cmd: bash src/make_folds.sh
    deps:
    - data/processed/hepg2_ELS.trimmed.bed
    - src/make_folds.sh
    outs:
    - data/processed/folds/fold1/fold1.bed
    - data/processed/folds/fold2/fold2.bed
    - data/processed/folds/fold3/fold3.bed
    - data/processed/folds/fold4/fold4.bed
    - data/processed/folds/fold5/fold5.bed
