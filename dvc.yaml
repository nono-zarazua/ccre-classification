    - results/evn/hepg2/ls-gkm/outer1.tsv
    - results/evn/hepg2/ls-gkm/outer2.tsv
    - results/evn/hepg2/ls-gkm/outer3.tsv
    - results/evn/hepg2/ls-gkm/outer4.tsv
    - results/evn/hepg2/ls-gkm/outer5.tsv
  merge_outers_hepg2:
    cmd: "{\n  head -n 1 results/evn/hepg2/ls-gkm/outer1.tsv\n  for FOLD in 1 2 3 4 5; do\n    tail -n +2 \"results/evn/hepg2/ls-gkm/outer$FOLD.tsv\"\
      \n  done\n} > results/evn/hepg2/ls-gkm/all_outers.tsv\n"
    deps:
    - results/evn/hepg2/ls-gkm/outer1.tsv
    - results/evn/hepg2/ls-gkm/outer2.tsv
    - results/evn/hepg2/ls-gkm/outer3.tsv
    - results/evn/hepg2/ls-gkm/outer4.tsv
    - results/evn/hepg2/ls-gkm/outer5.tsv
