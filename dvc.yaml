    - data/processed/evn/hepg2/ls-gkm/training/outer5/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer5/train_pos.fa
  train_ls_gkm_hepg2:
    cmd: bash ../lsgkm/bin/gkmtrain -T 4 -m 16000 '<pos_fa>' '<neg_fa>' 'output_prefix'
    deps:
    - ../lsgkm/bin/gkmtrain
    - data/processed/evn/hepg2/ls-gkm/training/outer1/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer1/train_pos.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer2/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer2/train_pos.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer3/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer3/train_pos.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer4/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer4/train_pos.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer5/train_neg.fa
    - data/processed/evn/hepg2/ls-gkm/training/outer5/train_pos.fa
