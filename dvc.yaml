    cmd: for i in 1 2 3 4 5; do Rscript src/prepare_lsgkm_scores.R predictions/evn/hepg2/ls-gkm/outer"$i"; done
    deps:
    - predictions/evn/hepg2/ls-gkm/outer1/neg_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer1/pos_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer2/neg_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer2/pos_scores.txt
    - predictions/evn/hepg2/ls-gkm/outer3/neg_scores.txt
